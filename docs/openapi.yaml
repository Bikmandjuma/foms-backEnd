  /users/import-groups:
    post:
      tags:
      - Users
      summary: Bulk-create Supervisor and Enumerator users from a group spreadsheet
      description: One row per person, grouped by the Group column, each stating its own role. Login is always email plus a password derived from that row's own phone number, Rwanda's +250 country code
        stripped and the local 07 prefix restored. Bad rows are skipped and reported individually, an email that already exists in the tenant is skipped as a duplicate.
      responses:
        '201':
          description: Import completed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ImportUserGroupsResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUserGroupsRequest'
