          type: string
        description: Program to report on
      - name: format
        in: query
        required: true
        schema:
          type: string
        description: pdf or csv
      - name: teamId
        in: query
        required: false
        schema:
          type: string
        description: Filter to a single group
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Filter by outcome status
      - name: period
        in: query
        required: false
        schema:
          type: string
        description: One of daily, weekly, monthly, yearly
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: Start of an explicit date range
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: End of an explicit date range
      - name: search
