  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Request a 6-digit password reset code by email
      description: Always responds the same way whether or not the email is registered (prevents account enumeration). If it exists, a 6-digit code valid for 15 minutes is emailed (or printed to the server
        console if SMTP isn't configured). Works identically for platform admins, tenant admins, and regular users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic confirmation message (does not reveal whether the email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/verify-reset-code:
    post:
      tags:
      - Auth
      summary: Verify a 6-digit reset code and obtain a short-lived reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyResetCodeRequest'
      responses:
        '200':
          description: Code verified ,returns { resetToken } valid for 10 minutes, single-use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Code is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Set a new password using a verified reset token
      description: On success, bumps tokenVersion ,every other device/session for this account is logged out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Reset token expired/invalid, or the code was already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /users/me/avatar:
    post:
