  /field-team-reports:
    get:
      tags:
      - Field Team Reports
      summary: Get the paginated field team report
      description: One row per team member and their currently assigned respondent. Supports program, group, status, date range, period shorthand, and search filters.
      parameters:
      - name: programId
        in: query
        required: true
        schema:
          type: string
        description: Program to report on
      - name: teamId
        in: query
        required: false
        schema:
          type: string
        description: Filter to a single group
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Filter by outcome status
      - name: period
        in: query
        required: false
        schema:
          type: string
        description: One of daily, weekly, monthly, yearly, used only when startDate/endDate are not given
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: Start of an explicit date range
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: End of an explicit date range
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Free text search across team, staff, and respondent names
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
        description: Rows per page, max 100
      responses:
        '200':
          description: Field team report retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FieldTeamReportResponse'
