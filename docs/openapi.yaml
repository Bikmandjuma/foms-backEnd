  /beneficiaries/import:
    post:
      tags:
      - Beneficiaries
      summary: Bulk-import respondents from an Excel file
      description: Programs are matched by exact name (case-insensitive) against the "programs" column (comma-separated), a program that doesn't already exist in the tenant is reported as a warning, not
        auto-created; that row still imports without the program link.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: .xlsx file matching the template's columns
      responses:
        '201':
          description: Import completed (may include per-row errors/warnings alongside successes)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ImportBeneficiariesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /program-assignments/bulk:
    post:
      tags:
      - Program Assignments
      summary: Assign multiple users to one program in a single call
      description: Users already actively assigned are silently skipped, not duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkProgramAssignmentRequest'
      responses:
        '201':
          description: Created assignments for whichever users weren't already active on this program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /beneficiary-assignments/auto-assign:
    post:
      tags:
      - Beneficiary Assignments
      summary: Run the Smart Assignment Engine ("Random Top-Up")
      description: Enumerators are auto-detected from active ProgramAssignments for the given program (never supplied manually). Eligible respondents (enrolled in the program, not REPLACED, no active caseworker)
        are shuffled and distributed into the given vehicles in order, each up to its own daily capacity; overflow after every vehicle is full is reported as `leftover` and simply carries into the next
        run of this same endpoint the same vehicle can "return for another trip" by calling this again later. Returns 422 if the program has no active enumerator assigned yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoAssignBeneficiariesRequest'
      responses:
        '201':
          description: Assignment run completed full per-vehicle breakdown returned for immediate display
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutoAssignBeneficiariesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The program has no active enumerator assigned yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /beneficiary-assignments/report:
    get:
      tags:
      - Beneficiary Assignments
      summary: Download a report of a program's current assignment run
      parameters:
      - name: programId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: vehicleId
        in: query
        required: false
        description: Narrow the report to one vehicle's respondents
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
