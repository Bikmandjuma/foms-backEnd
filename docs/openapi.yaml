openapi: 3.0.3
info:
  title: HUska Survey Backend API
  description: Multi-tenant survey backend with JWT auth, roles, users, and tenants.
  version: 1.0.0
servers:
- url: /api
  description: API base path
tags:
- name: Auth
- name: Users
- name: Roles
- name: Tenants
- name: Programs
- name: Beneficiaries
- name: Program Assignments
- name: Beneficiary Assignments
- name: Vehicles
- name: Replacement Requests
- name: Field Monitoring
- name: Geo
- name: Activity Logs
- name: Notifications
- name: Dashboard
- name: Meta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send the login token as `Authorization: Bearer <token>`.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Alternative to bearerAuth, the httpOnly cookie set by /auth/login.
  schemas:
    ApiResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Request successful
        data:
          nullable: true
      required:
      - statusCode
      - message
      - data
    Gender:
      type: string
      enum:
      - MALE
      - FEMALE
      - OTHER
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
    EducationLevel:
      type: string
      enum:
      - NONE
      - PRIMARY
      - SECONDARY
      - BACHELORS
      - MASTERS
      - DOCTORATE
    RoleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        telephone:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        cell:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        educationLevel:
          $ref: '#/components/schemas/EducationLevel'
        roleId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleSummary'
        tenantId:
          type: string
          format: uuid
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserProfileFields:
      type: object
      properties:
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        telephone:
          type: string
        province:
          type: string
        district:
          type: string
        sector:
          type: string
        cell:
          type: string
        village:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/UserStatus'
        educationLevel:
          $ref: '#/components/schemas/EducationLevel'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CreateUserRequest:
      allOf:
      - type: object
        required:
        - email
        - password
        - roleId
        properties:
          email:
            type: string
            format: email
          password:
            type: string
            minLength: 8
          roleId:
            type: string
            format: uuid
      - $ref: '#/components/schemas/UserProfileFields'
    UpdateUserRequest:
      allOf:
      - type: object
        properties:
          email:
            type: string
            format: email
          password:
            type: string
            minLength: 8
          roleId:
            type: string
            format: uuid
      - $ref: '#/components/schemas/UserProfileFields'
    CreateRoleRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    CreateTenantRequest:
      type: object
      required:
      - name
      - admin
      properties:
        name:
          type: string
        admin:
          allOf:
          - type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 8
          - $ref: '#/components/schemas/UserProfileFields'
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProgramRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateProgramRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ProgramSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Beneficiary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: BEN-2026-00001
          description: Auto-generated on creation, unique per tenant.
        name:
          type: string
        telephone:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        province:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        cell:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        nationalId:
          type: string
          nullable: true
        householdSize:
          type: integer
          nullable: true
        consentGiven:
          type: boolean
        consentAt:
          type: string
          format: date-time
          nullable: true
        outcome:
          $ref: '#/components/schemas/ResponseOutcome'
        tenantId:
          type: string
          format: uuid
        programs:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BeneficiaryFields:
      type: object
      properties:
        name:
          type: string
        telephone:
          type: string
        province:
          type: string
        district:
          type: string
        sector:
          type: string
        cell:
          type: string
        village:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/UserStatus'
        nationalId:
          type: string
        householdSize:
          type: integer
          minimum: 0
        programIds:
          type: array
          items:
            type: string
            format: uuid
        consentGiven:
          type: boolean
        consentAt:
          type: string
          format: date
        outcome:
          $ref: '#/components/schemas/ResponseOutcome'
    CreateBeneficiaryRequest:
      allOf:
      - type: object
        required:
        - name
      - $ref: '#/components/schemas/BeneficiaryFields'
    UpdateBeneficiaryRequest:
      $ref: '#/components/schemas/BeneficiaryFields'
    AssignmentStatus:
      type: string
      enum:
      - ACTIVE
      - ENDED
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
    BeneficiarySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ProgramAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        assignedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        userId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        program:
          $ref: '#/components/schemas/ProgramSummary'
    CreateProgramAssignmentRequest:
      type: object
      required:
      - userId
      - programId
      properties:
        userId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
    BeneficiaryAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        assignedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        beneficiaryId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        beneficiary:
          $ref: '#/components/schemas/BeneficiarySummary'
    CreateBeneficiaryAssignmentRequest:
      type: object
      required:
      - beneficiaryId
      - userId
      properties:
        beneficiaryId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    BulkProgramAssignmentRequest:
      type: object
      required:
      - programId
      - userIds
      properties:
        programId:
          type: string
          format: uuid
        userIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
    AutoAssignBeneficiariesRequest:
      type: object
      required:
      - programId
      - vehicleIds
      description: The Smart Assignment Engine ("Random Top-Up"). Enumerators are auto-detected from active ProgramAssignments for this program they are never listed manually here. Returns 422 if the program
        has no active enumerator yet.
      properties:
        programId:
          type: string
          format: uuid
        vehicleIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
    AssignmentEngineVehicleResult:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        driverName:
          type: string
          nullable: true
        capacityPerDay:
          type: integer
          nullable: true
        assigned:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              userId:
                type: string
                format: uuid
              userName:
                type: string
    AutoAssignBeneficiariesResponse:
      type: object
      properties:
        program:
          $ref: '#/components/schemas/ProgramSummary'
        enumerators:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentEngineVehicleResult'
        totalCandidates:
          type: integer
        totalAssigned:
          type: integer
        leftover:
          type: integer
          description: Eligible respondents not placed this run because every selected vehicle reached capacity, carries into the next run automatically.
    VehicleType:
      type: string
      enum:
      - VEHICLE
      - MOTORCYCLE
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        driverName:
          type: string
          nullable: true
        capacityPerDay:
          type: integer
          nullable: true
        active:
          type: boolean
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        driverName:
          type: string
        capacityPerDay:
          type: integer
          minimum: 1
        active:
          type: boolean
          default: true
    UpdateVehicleRequest:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        driverName:
          type: string
        capacityPerDay:
          type: integer
          minimum: 1
          nullable: true
        active:
          type: boolean
    GeoMatchLevel:
      type: string
      nullable: true
      enum:
      - VILLAGE
      - CELL
      - SECTOR
      - DISTRICT
      - PROVINCE
      description: Null means no geographic overlap was found anywhere a random respondent was used instead.
    ReplacementStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    ReplacementRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ReplacementStatus'
        matchLevel:
          $ref: '#/components/schemas/GeoMatchLevel'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        originalRespondentId:
          type: string
          format: uuid
        originalRespondent:
          $ref: '#/components/schemas/BeneficiarySummary'
        candidateRespondentId:
          type: string
          format: uuid
          nullable: true
        candidateRespondent:
          allOf:
          - $ref: '#/components/schemas/BeneficiarySummary'
          nullable: true
        requestedByUserId:
          type: string
          format: uuid
        requestedBy:
          $ref: '#/components/schemas/UserSummary'
        decidedByUserId:
          type: string
          format: uuid
          nullable: true
        decidedBy:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
    CreateReplacementRequestRequest:
      type: object
      required:
      - originalRespondentId
      - reason
      description: Fully automatic ,no approval step. The system searches village -> cell -> sector -> district -> province for a candidate and finalizes the replacement in this same request. If several
        respondents share the closest matching tier, one is picked at random among them; if none match anywhere, a random respondent elsewhere in the tenant is used. Only falls back to PENDING (status)
        if literally no other respondent exists yet use the /retry endpoint once one does.
      properties:
        originalRespondentId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
    ResponseOutcome:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - REFUSED
      - NOT_FOUND
      - RELOCATED
      - DECEASED
      - REPLACED
    FieldCheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkInAt:
          type: string
          format: date-time
        checkOutAt:
          type: string
          format: date-time
          nullable: true
        gpsLat:
          type: number
          nullable: true
        gpsLng:
          type: number
          nullable: true
        note:
          type: string
          nullable: true
        currentGpsLat:
          type: number
          nullable: true
        currentGpsLng:
          type: number
          nullable: true
        currentGpsAt:
          type: string
          format: date-time
          nullable: true
        currentGpsNote:
          type: string
          nullable: true
        userId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        projectId:
          type: string
          format: uuid
          nullable: true
        project:
          $ref: '#/components/schemas/ProgramSummary'
        tenantId:
          type: string
          format: uuid
    CreateFieldCheckInRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        gpsLat:
          type: number
        gpsLng:
          type: number
        note:
          type: string
    CheckoutRequest:
      type: object
      properties:
        overrideReason:
          type: string
    PingGpsRequest:
      type: object
      required:
      - gpsLat
      - gpsLng
      properties:
        gpsLat:
          type: number
        gpsLng:
          type: number
        note:
          type: string
    RecordVisitOutcomeRequest:
      type: object
      required:
      - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/ResponseOutcome'
        note:
          type: string
    FieldVisit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkInId:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ResponseOutcome'
        note:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
    AddFieldNoteRequest:
      type: object
      required:
      - note
      properties:
        note:
          type: string
          minLength: 1
    FieldNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkInId:
          type: string
          format: uuid
        note:
          type: string
        createdAt:
          type: string
          format: date-time
    TodayRespondent:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        beneficiary:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
            province:
              type: string
              nullable: true
            district:
              type: string
              nullable: true
            sector:
              type: string
              nullable: true
            cell:
              type: string
              nullable: true
            village:
              type: string
              nullable: true
            outcome:
              $ref: '#/components/schemas/ResponseOutcome'
        visit:
          type: object
          nullable: true
          properties:
            outcome:
              $ref: '#/components/schemas/ResponseOutcome'
            note:
              type: string
              nullable: true
            recordedAt:
              type: string
              format: date-time
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    VerifyResetCodeRequest:
      type: object
      required:
      - email
      - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: '482913'
    ResetPasswordRequest:
      type: object
      required:
      - resetToken
      - newPassword
      properties:
        resetToken:
          type: string
          description: Returned by POST /auth/verify-reset-code. Valid for 10 minutes and single-use.
        newPassword:
          type: string
          minLength: 8
    UpdateMyProfileRequest:
      type: object
      description: Self-service profile update anyone can edit their own firstName/lastName/telephone/address, regardless of role/permissions. Role and status are not editable here.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        telephone:
          type: string
        province:
          type: string
        district:
          type: string
        sector:
          type: string
        cell:
          type: string
        village:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date
    PermissionGroup:
      type: object
      properties:
        label:
          type: string
          example: Beneficiaries
        permissions:
          type: array
          items:
            type: string
            example: beneficiaries:edit
    AdminLocationRow:
      type: string
      description: A single administrative unit name at the requested tier (province/district/sector/cell/village).
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: created
        entityType:
          type: string
          example: Beneficiary
        entityId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
          nullable: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
    NotificationType:
      type: string
      enum:
      - ASSIGNMENT_PROGRAM
      - ASSIGNMENT_BENEFICIARY
      - REPLACEMENT_REQUESTED
      - REPLACEMENT_DECIDED
      - SYSTEM
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
        read:
          type: boolean
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          nullable: true
    DashboardCounts:
      type: object
      properties:
        users:
          type: integer
        roles:
          type: integer
        programs:
          type: integer
        beneficiaries:
          type: integer
        tenants:
          type: integer
          description: Only populated for platform admins
        pendingReplacements:
          type: integer
        activeCheckIns:
          type: integer
        onlineUsers:
          type: integer
    DashboardSummary:
      type: object
      properties:
        counts:
          $ref: '#/components/schemas/DashboardCounts'
        beneficiariesByOutcome:
          type: array
          items:
            type: object
            properties:
              outcome:
                $ref: '#/components/schemas/ResponseOutcome'
              count:
                type: integer
        programsByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        checkInSeries:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                example: Mon
              checkIns:
                type: integer
    DashboardChartResponse:
      type: object
      properties:
        metric:
          type: string
          enum:
          - checkins
          - online-users
          - beneficiary-attendance
        period:
          type: string
          enum:
          - week
          - month
          - year
          - lifetime
        title:
          type: string
          example: Field check-ins, last 7 days
        subtitle:
