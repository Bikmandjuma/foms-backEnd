      - Users
      summary: Upload/replace the caller's own profile photo
      description: Always affects the caller's own account, there's no endpoint to set someone else's avatar.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG, PNG, WEBP, or GIF, up to 4MB
